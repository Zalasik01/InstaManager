name: Migrações do banco (manual)

# Aplica as migrações novas de supabase/migrations no banco de produção com "supabase db push".
# NUNCA roda sozinho: só por Actions > "Migrações do banco (manual)" > Run workflow.
# Sempre mostra antes a simulação (--dry-run) com o que seria aplicado. Só aplica de verdade se o campo
# de confirmação for exatamente "aplicar". O job usa o environment "producao": no GitHub dá para exigir
# aprovação do dono antes de rodar (Settings > Environments > producao > Required reviewers).
#
# Segredos: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD (veja docs/deploy-automatico.md).

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "aplicar" para aplicar de verdade. Qualquer outro valor só simula (--dry-run).'
        type: string
        required: true
        default: simular

permissions:
  contents: read

concurrency:
  group: migracoes
  cancel-in-progress: false

jobs:
  migracoes:
    name: supabase db push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0 # CLI v3: alvo remoto via --remote; --yes confirma sem perguntar
      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Faltam segredos do Supabase (veja docs/deploy-automatico.md)."
            exit 1
          fi
      # Na CLI v3 o "db push" mira o banco LOCAL por padrão: --remote=<ref> aponta para o projeto de produção.
      - name: Simulação (o que seria aplicado)
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Aplicar migrações
        if: inputs.confirmacao == 'aplicar'
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
